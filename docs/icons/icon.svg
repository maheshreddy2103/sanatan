<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#b83818" />
      <stop offset="45%" stop-color="#801818" />
      <stop offset="85%" stop-color="#3d1410" />
      <stop offset="100%" stop-color="#1f0907" />
    </radialGradient>
    
    <!-- Gold Gradient for Mandala & Border -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe27a" />
      <stop offset="35%" stop-color="#e5b32e" />
      <stop offset="70%" stop-color="#c69214" />
      <stop offset="100%" stop-color="#93670c" />
    </linearGradient>

    <!-- Divine Glow Filter -->
    <filter id="divineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with Rounded App Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Sacred Border -->
  <rect x="18" y="18" width="476" height="476" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.85" />
  <rect x="28" y="28" width="456" height="456" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.6" />

  <!-- Sacred Radiance Rays -->
  <g transform="translate(256, 256)" opacity="0.22" stroke="url(#goldGrad)" stroke-width="2">
    <line x1="0" y1="-210" x2="0" y2="210" />
    <line x1="-210" y1="0" x2="210" y2="0" />
    <line x1="-148" y1="-148" x2="148" y2="148" />
    <line x1="-148" y1="148" x2="148" y2="-148" />
    <line x1="-80" y1="-194" x2="80" y2="194" />
    <line x1="80" y1="-194" x2="-80" y2="194" />
    <line x1="-194" y1="-80" x2="194" y2="80" />
    <line x1="194" y1="-80" x2="-194" y2="80" />
  </g>

  <!-- Inner Sacred Halo -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" opacity="0.75" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.5" />
  
  <!-- Subtle Lotus Petal Accents on Ring -->
  <g fill="url(#goldGrad)" opacity="0.8" transform="translate(256, 256)">
    <circle cx="0" cy="-168" r="5" />
    <circle cx="0" cy="168" r="5" />
    <circle cx="-168" cy="0" r="5" />
    <circle cx="168" cy="0" r="5" />
    <circle cx="-119" cy="-119" r="4" />
    <circle cx="119" cy="-119" r="4" />
    <circle cx="-119" cy="119" r="4" />
    <circle cx="119" cy="119" r="4" />
  </g>

  <!-- Central Sacred Om (ॐ) -->
  <text 
    x="256" 
    y="336" 
    text-anchor="middle" 
    font-family="'Noto Serif Devanagari', 'Segoe UI', 'Arial', sans-serif" 
    font-size="228" 
    font-weight="bold" 
    fill="url(#goldGrad)" 
    filter="url(#divineGlow)"
  >ॐ</text>
</svg>
